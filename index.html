<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Smart Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="page">
            <section class="calc" id="calc" aria-label="Calculator">
                <header class="top">
                    <h1>Calculator</h1>
                    <div class="tools">
                        <button class="icon-btn" id="history-toggle" type="button" aria-label="Show history" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
                        </button>
                        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
                            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                        </button>
                    </div>
                </header>

                <div class="screen">
                    <div class="sub" id="sub"></div>
                    <div class="main" id="main">0</div>
                    <button class="back" type="button" data-k="back" aria-label="Backspace">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
                    </button>
                </div>

                <div class="keys">
                    <button class="key fn" type="button" data-k="clear" aria-label="Clear all">AC</button>
                    <button class="key fn" type="button" data-k="paren" aria-label="Brackets">( )</button>
                    <button class="key fn" type="button" data-k="%" aria-label="Percent">%</button>
                    <button class="key op" type="button" data-k="/" aria-label="Divide">&divide;</button>

                    <button class="key" type="button" data-k="7">7</button>
                    <button class="key" type="button" data-k="8">8</button>
                    <button class="key" type="button" data-k="9">9</button>
                    <button class="key op" type="button" data-k="*" aria-label="Multiply">&times;</button>

                    <button class="key" type="button" data-k="4">4</button>
                    <button class="key" type="button" data-k="5">5</button>
                    <button class="key" type="button" data-k="6">6</button>
                    <button class="key op" type="button" data-k="-" aria-label="Subtract">&minus;</button>

                    <button class="key" type="button" data-k="1">1</button>
                    <button class="key" type="button" data-k="2">2</button>
                    <button class="key" type="button" data-k="3">3</button>
                    <button class="key op" type="button" data-k="+" aria-label="Add">+</button>

                    <button class="key" type="button" data-k="neg" aria-label="Plus or minus">&plusmn;</button>
                    <button class="key" type="button" data-k="0">0</button>
                    <button class="key" type="button" data-k="." aria-label="Decimal point">.</button>
                    <button class="key eq" type="button" data-k="=" aria-label="Equals">=</button>
                </div>

                <aside class="history" id="history" aria-label="History" inert>
                    <div class="h-head">
                        <h2>History</h2>
                        <button class="link" id="history-clear" type="button">Clear all</button>
                    </div>
                    <div class="h-list" id="h-list"></div>
                </aside>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
